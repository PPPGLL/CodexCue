[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codexcue"
version = "0.1.0b4"
description = "A local, opt-in autocomplete companion for Codex on Windows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "CodexCue contributors" }]
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.28,<1",
  "uiautomation>=2.0,<3",
  "psutil>=6,<8",
  "tiktoken>=0.9,<1",
]

[project.scripts]
codexcue = "codex_companion.app:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]
build = ["pyinstaller>=6.12,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
